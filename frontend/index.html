<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#EEF6FF" />
    <link rel="icon" href="/favicon.ico" />
    <title>%VITE_APP_TITLE%</title>
    <!--[if lt IE 11
      ]><script>
        window.location.href = '/html/ie.html';
      </script><!
    [endif]-->
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background: #eef6ff;
      }

      /* ---------- 首屏加载：洋葱标识 + 滑行进度 ---------- */
      #loader-wrapper {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(760px 520px at 20% -10%, rgba(43, 156, 240, 0.18), transparent 62%),
          radial-gradient(700px 480px at 88% 8%, rgba(79, 201, 138, 0.13), transparent 66%),
          #eef6ff;
        transition: opacity 0.35s ease;
      }

      .sm-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      /* 洋葱方块标识：带底部厚度，呼应按钮的实体感 */
      .sm-boot-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #2b9cf0;
        box-shadow: 0 4px 0 #0e6fb8;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: sm-boot-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .sm-boot-mark svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      .sm-boot-track {
        width: 132px;
        height: 5px;
        border-radius: 999px;
        background: #dbe7f4;
        overflow: hidden;
      }

      .sm-boot-bar {
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: #2b9cf0;
        animation: sm-boot-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .sm-boot-text {
        margin: 0;
        font-family: 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #8095ab;
      }

      @keyframes sm-boot-pop {
        from {
          opacity: 0;
          transform: scale(0.7) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes sm-boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sm-boot-mark,
        .sm-boot-bar {
          animation: none;
        }
      }

      .loaded #loader-wrapper {
        opacity: 0;
        visibility: hidden;
      }

      .no-js #loader-wrapper {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="loader-wrapper">
        <div class="sm-boot">
          <div class="sm-boot-mark">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 1.7c.15 1.7.6 2.9 1.35 3.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
              <path d="M12 4.9c4.3 0 8.3 3.4 8.3 8.8 0 5.6-3.7 8.7-8.3 8.7S3.7 19.3 3.7 13.7C3.7 8.3 7.7 4.9 12 4.9Z" fill="currentColor" />
              <path
                d="M9.2 7c-1.5 1.8-2.2 3.8-2.2 6.1 0 3.3 1.3 5.9 3 7.3"
                stroke="#2b9cf0"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <path
                d="M14.8 7c1.5 1.8 2.2 3.8 2.2 6.1 0 3.3-1.3 5.9-3 7.3"
                stroke="#2b9cf0"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="sm-boot-track"><div class="sm-boot-bar"></div></div>
          <p class="sm-boot-text">正在加载</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
